name: Python & Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t user-registration-fastapi:latest .

      - name: Verify Docker container health
        run: |
          docker run -d --name ci-api-test -p 8000:8000 user-registration-fastapi:latest
          sleep 3
          curl -f http://localhost:8000/ || exit 1
          docker stop ci-api-test && docker rm ci-api-test
